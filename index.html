<style>

/* Mobile viewport + iPhone safe-area fixes */
:root { --pw-safe-top: env(safe-area-inset-top, 0px); --pw-safe-bottom: env(safe-area-inset-bottom, 0px); }
html { min-height: 100%; -webkit-text-size-adjust: 100%; }
body { padding-top: 0 !important; padding-bottom: calc(88px + var(--pw-safe-bottom)) !important; }
#app, .app, .shell, .main, main { box-sizing: border-box; }
@supports (padding: max(0px)) {
  body { padding-top: max(12px, var(--pw-safe-top)) !important; padding-bottom: max(calc(88px + var(--pw-safe-bottom)), 100px) !important; }
}
@media (max-width: 600px) {
  body { overflow-x: hidden; }
  header, .topbar, .app-header, .header, .brandbar, .top-header {
    padding-top: max(14px, env(safe-area-inset-top, 0px)) !important;
  }
  .app-header, .topbar, header {
    min-height: 58px;
    box-sizing: border-box;
  }
  .page, .page-content, .content, main, #app {
    scroll-margin-top: 16px;
  }
  .bottom-nav, nav.bottom-nav, .tabbar, .bottom-tabs {
    padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)) !important;
  }
  button, .btn, .icon-btn, .nav-item, .tab {
    min-height: 40px;
  }
  button svg, .btn svg, .icon-btn svg, .nav-item svg, .tab svg,
  button i, .btn i, .icon-btn i, .nav-item i, .tab i {
    width: 20px !important; height: 20px !important;
    min-width: 20px; min-height: 20px;
    flex-shrink: 0;
  }
}
/* Improve icon visibility when inherited colors are too pale or too small */
button svg, .btn svg, .icon-btn svg, .nav-item svg, .tab svg {
  stroke-width: 2.25;
}
button .icon, .btn .icon, .icon-btn .icon, .nav-item .icon, .tab .icon,
button i, .btn i, .icon-btn i, .nav-item i, .tab i {
  font-size: 20px !important;
  line-height: 1 !important;
}
/* Ensure common controls have sufficient contrast in both themes */
button, .btn, .icon-btn, .nav-item, .tab {
  color: var(--text, #17221c);
}
.btn.green, button.green, .primary, .btn-primary {
  color: #ffffff !important;
}

</style>

 <div class="greeting" id="greeting">YOUR MONEY, IN FOCUS</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const today = () => new Date().toISOString().slice(0,10);
const monthKey = (d=today()) => d.slice(0,7);
const money = (n,p=active()) => new Intl.NumberFormat(p==='qatar'?'en-QA':'en-IN',{style:'currency',currency:p==='qatar'?'QAR':'INR',maximumFractionDigits:2}).format(Number(n)||0);
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const defaults = () => ({
 qatar:{currency:'QAR',accounts:[{id:'cash',name:'Cash wallet',type:'cash',opening:0},{id:'bank',name:'Bank account',type:'bank',opening:0}],transactions:[],budgets:[],credits:[],payments:[],recurring:[]},
 india:{currency:'INR',accounts:[{id:'cash',name:'Cash wallet',type:'cash',opening:0},{id:'bank',name:'Bank account',type:'bank',opening:0}],transactions:[],budgets:[],credits:[],payments:[],recurring:[]}
});
let data;
try{data=JSON.parse(localStorage.getItem('pennywise-data-v1'))||defaults()}catch(e){data=defaults()}
for(const p of ['qatar','india']){if(!data[p])data[p]=defaults()[p];for(const k of ['accounts','transactions','budgets','credits','payments','recurring'])if(!Array.isArray(data[p][k]))data[p][k]=[];if(!data[p].accounts.length)data[p].accounts=defaults()[p].accounts}
let currentProfile=localStorage.getItem('pennywise-last-profile')||'qatar';
let page='home', transactionFilter='all', creditTab='given', editingTx=null, budgetEditing=false;
const active=()=>currentProfile;
const db=()=>data[active()];
const currency=()=>active()==='qatar'?'QAR':'INR';
const save=()=>{localStorage.setItem('pennywise-data-v1',JSON.stringify(data));localStorage.setItem('pennywise-last-profile',currentProfile)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=(arr,fn)=>arr.reduce((a,x)=>a+fn(x),0);
function txAmount(t){return Number(t.amount)||0}
function accountBalance(accountId){const a=db().accounts.find(x=>x.id===accountId);if(!a)return 0;let n=Number(a.opening)||0;for(const t of db().transactions){if(t.accountId===accountId){if(t.type==='income')n+=txAmount(t);if(t.type==='expense')n-=txAmount(t)}if(t.type==='transfer'){if(t.accountId===accountId)n-=txAmount(t);if(t.toAccountId===accountId)n+=txAmount(t)}}return n}
function totalBalance(){return sum(db().accounts,a=>accountBalance(a.id))}
function monthTx(){return db().transactions.filter(t=>t.date?.slice(0,7)===monthKey())}
function totals(){const tx=monthTx();return {income:sum(tx.filter(t=>t.type==='income'),txAmount),expense:sum(tx.filter(t=>t.type==='expense'),txAmount)}}
function setPage(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p||(p==='add'&&b.dataset.page==='add')));render()}
function pageHead(title,sub='',action=''){return `<div class="pagehead"><div><h1>${title}</h1>${sub?`<div class="muted small" style="margin-top:5px">${sub}</div>`:''}</div>${action}</div>`}
function empty(icon,msg){return `<div class="empty"><div class="big">${icon}</div>${msg}</div>`}
function itemIcon(t){return ({income:'↙',expense:'↗',transfer:'⇄'})[t.type]||'•'}
function txRow(t){const label=t.type==='transfer'?`Transfer · ${esc(accountName(t.accountId))} → ${esc(accountName(t.toAccountId))}`:esc(t.category||t.type);const sign=t.type==='income'?'+':t.type==='expense'?'−':'';const cls=t.type==='income'?'amountin':t.type==='expense'?'amountout':'';return `<div class="rowitem"><div class="bubble">${itemIcon(t)}</div><div class="grow"><div class="rowtitle">${esc(t.title||label)}</div><div class="rowmeta">${label} · ${esc(t.date||'')}</div></div><div class="rowamount ${cls}">${sign}${money(t.amount)}<div style="margin-top:5px"><button class="btn light smallbtn" onclick="editTx('${t.id}')">Edit</button></div></div></div>`}
function accountName(id){return db().accounts.find(a=>a.id===id)?.name||'Account'}
function budgetCard(b){const spent=sum(db().transactions.filter(t=>t.type==='expense'&&t.category===b.category&&t.date?.slice(0,7)===monthKey()),txAmount);const pct=b.limit?spent/b.limit*100:0;const cl=pct>=100?'over':pct>=75?'warn':'';return `<div class="card"><div class="row"><div class="grow"><div class="rowtitle">${esc(b.category)}</div><div class="rowmeta">${money(spent)} spent of ${money(b.limit)}</div></div><span class="pill ${pct>=100?'red':pct>=75?'orange':''}">${Math.round(pct)}%</span></div><div class="progress ${cl}"><div style="width:${Math.min(100,pct)}%"></div></div><div class="row"><span class="small muted">${pct>=100?'Over budget':money(Math.max(0,b.limit-spent))+' remaining'}</span><button class="btn light smallbtn right" onclick="deleteBudget('${b.id}')">Remove</button></div></div>`}
function editTotalBudget(){budgetEditing=true;render();const input=document.getElementById('homeBudgetInput');if(input){input.focus();input.select();}}
function home(){const t=totals(),tx=[...db().transactions].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,4),due=db().credits.filter(c=>Number(c.remaining)>0&&c.dueDate&&c.dueDate<today()).length;const limit=Number(db().totalBudget)||0,pct=limit?Math.min(100,t.expense/limit*100):0;return `${pageHead('Overview',new Date().toLocaleDateString(undefined,{month:'long',year:'numeric'}))}${due?`<div class="notice">⚠ You have ${due} overdue credit/debt record(s). Check More → Credit & Debt.</div>`:''}<div class="sectionhead"><h2>Total monthly budget</h2></div><div class="card total-budget-card">${budgetEditing?`<form id="homeBudgetForm" onsubmit="saveHomeBudget(event)"><div class="budget-editor-heading">Set your monthly limit</div><label class="budget-input-label" for="homeBudgetInput">Total budget (${currency()})</label><div class="budget-input-row"><input id="homeBudgetInput" name="limit" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="e.g. 2000" value="${limit||''}" required><button class="btn green" type="submit">Save limit</button></div><button type="button" class="btn light smallbtn" style="margin-top:10px" onclick="cancelBudgetEdit()">Cancel</button></form>`:`<div class="budget-top"><div class="budget-total"><div class="row" style="justify-content:flex-start;align-items:center;gap:8px"><div class="rowmeta">Monthly limit</div><button class="btn light smallbtn" type="button" onclick="editTotalBudget()">${limit?'Change limit':'Set limit'}</button></div><div class="budget-number">${limit?money(limit):'Not set'}</div></div><div class="budget-spent"><div class="rowmeta">Spent this month</div><div class="budget-spent-number">${money(t.expense)}</div></div></div><div class="budget-progress-track" role="progressbar" aria-label="Monthly budget used" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${limit?Math.round(t.expense/limit*100):0}"><div class="budget-progress-fill ${pct>=100&&limit?'over':pct>=75&&limit?'warn':''}" style="width:${pct}%;${t.expense>0?'min-width:3px;':''}"></div></div><div class="budget-bottom"><span>${limit?Math.round(t.expense/limit*100)+'% used':'Set a limit to track progress'}</span><strong>${limit?(t.expense>limit?money(t.expense-limit)+' over':money(Math.max(0,limit-t.expense))+' remaining'):'Limit not set'}</strong></div>${limit&&t.expense>limit?`<div class="notice" style="margin-top:12px">You are ${money(t.expense-limit)} over budget.</div>`:'' }</div>`}<div class="sectionhead"><h2>Accounts & balances</h2><button class="btn light smallbtn" onclick="setPage('accounts')">Manage</button></div><div class="card">${db().accounts.map(a=>`<div class="rowitem"><div class="bubble">${a.type==='cash'?'◉':'▣'}</div><div class="grow"><div class="rowtitle">${esc(a.name)}</div><div class="rowmeta">${esc(a.type)} account</div></div><div class="rowamount">${money(accountBalance(a.id))}</div></div>`).join('')}<button class="btn light full" style="margin-top:10px" onclick="setPage('accounts')">＋ Add account or cash wallet</button></div><div class="grid2"><button class="tile" onclick="setPage('credit')"><div class="ico">↔</div><strong>Credit & Debt</strong><span>${db().credits.filter(c=>c.kind==='given'&&c.remaining>0).length} owed to you · ${db().credits.filter(c=>c.kind==='taken'&&c.remaining>0).length} you owe</span></button><button class="tile" onclick="setPage('reports')"><div class="ico">▥</div><strong>Reports</strong><span>Monthly charts and trends</span></button></div><div class="sectionhead" style="margin-top:22px"><h2>Recent transactions</h2><button class="btn light smallbtn" onclick="setPage('transactions')">See all</button></div><div class="card">${tx.length?tx.map(txRow).join(''):empty('↔','Your transactions will appear here.')}</div>`}
function transactions(){let list=[...db().transactions].sort((a,b)=>(b.date||'').localeCompare(a.date||''));if(transactionFilter!=='all')list=list.filter(t=>t.type===transactionFilter);return `${pageHead('Transactions','Your complete activity',`<button class="btn green smallbtn" onclick="openAdd()">＋ Add</button>`)}<div class="filterrow">${[['all','All'],['income','Income'],['expense','Expenses'],['transfer','Transfers']].map(([v,l])=>`<button class="${transactionFilter===v?'active':''}" onclick="setTransactionFilter('${v}')">${l}</button>`).join('')}</div><div class="field"><input id="txSearch" placeholder="Search transactions…" oninput="filterTxSearch(this.value)"></div><div class="card" id="txList">${list.length?list.map(txRow).join(''):empty('↔','No transactions yet.')}</div>`}
function addForm(type='expense'){const isTransfer=type==='transfer';return `${pageHead(editingTx?'Edit transaction':'Add transaction','Saved only to your active profile')}<div class="tabs">${[['expense','Expense'],['income','Income'],['transfer','Transfer']].map(([v,l])=>`<button class="${type===v?'active':''}" onclick="openAdd('${v}')">${l}</button>`).join('')}</div><form id="txForm" onsubmit="saveTx(event)"><input type="hidden" name="id" value="${editingTx?.id||''}"><input type="hidden" name="type" value="${type}"><div class="field"><label>Amount (${currency()})</label><input name="amount" type="number" min="0.01" step="0.01" required placeholder="0.00" value="${editingTx?esc(editingTx.amount):''}"></div><div class="field"><label>${isTransfer?'From account':'Account'}</label><select name="accountId" required>${db().accounts.map(a=>`<option value="${a.id}" ${(editingTx?.accountId||db().accounts[0]?.id)===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>${isTransfer?`<div class="field"><label>To account</label><select name="toAccountId" required>${db().accounts.map(a=>`<option value="${a.id}" ${editingTx?.toAccountId===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>`:`<div class="field"><label>Category</label><select name="category">${(type==='income'?['Salary','Business','Gift','Refund','Other income']:['Food','Transport','Rent','Groceries','Shopping','Bills','Health','Entertainment','Education','Travel','Other']).map(c=>`<option ${editingTx?.category===c?'selected':''}>${c}</option>`).join('')}</select></div>`}<div class="field"><label>Description</label><input name="title" maxlength="100" placeholder="What was this for?" value="${esc(editingTx?.title||'')}"></div><div class="formgrid"><div class="field"><label>Date</label><input name="date" type="date" value="${editingTx?.date||today()}" required></div><div class="field"><label>Payment note (optional)</label><input name="note" placeholder="Cash, card…" value="${esc(editingTx?.note||'')}"></div></div><button class="btn green full" type="submit">${editingTx?'Save changes':'Save '+type}</button>${editingTx?`<button type="button" class="btn danger full" style="margin-top:8px" onclick="deleteTx('${editingTx.id}')">Delete transaction</button>`:''}</form>`}
function budgets(){
 const t=totals(),limit=Number(db().totalBudget)||0,usedPct=limit?t.expense/limit*100:0,pct=Math.min(100,usedPct);
 const now=new Date(),day=now.getDate(),days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),remaining=limit-t.expense;
 const daily=limit>0?Math.max(0,remaining)/(days-day+1):0,projected=day>0?(t.expense/day)*days:0;
 const status=!limit?'Set a limit to start tracking':usedPct>=100?'You have reached or exceeded your limit':usedPct>=75?'You have used most of your budget':'You are within your monthly budget';
 const recent=db().transactions.filter(x=>x.type==='expense'&&x.date?.slice(0,7)===monthKey()).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5);
 return `${pageHead('Budgets','One monthly limit · simple spending control')}
 <div class="card total-budget-card">
   <div class="row" style="align-items:flex-start;gap:12px">
     <div class="grow"><div class="rowmeta">Monthly spending limit</div><div class="budget-number">${limit?money(limit):'Not set'}</div></div>
     <button class="btn green smallbtn" type="button" onclick="editBudgetFromTab()">${limit?'Change limit':'Set limit'}</button>
   </div>
   <div class="budget-top" style="margin-top:18px">
     <div><div class="rowmeta">Spent this month</div><div class="budget-spent-number">${money(t.expense)}</div></div>
     <div style="text-align:right"><div class="rowmeta">Remaining</div><div class="budget-spent-number">${limit?money(Math.max(0,remaining)):'—'}</div></div>
   </div>
   <div class="budget-progress-track" role="progressbar" aria-label="Monthly budget used" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${limit?Math.round(usedPct):0}">
     <div class="budget-progress-fill ${limit&&usedPct>=100?'over':limit&&usedPct>=75?'warn':''}" style="width:${pct}%;${t.expense>0?'min-width:3px;':''}"></div>
   </div>
   <div class="budget-bottom"><span>${limit?Math.round(usedPct)+'% used':'Progress appears after you set a limit'}</span><strong>${limit?(remaining<0?money(-remaining)+' over limit':money(remaining)+' left'):'—'}</strong></div>
   <div class="notice" style="margin-top:14px">${status}${limit&&usedPct>=100?` · Over by ${money(t.expense-limit)}`:''}</div>
 </div>
 <div class="grid2">
   <div class="card"><div class="rowmeta">Daily spending guide</div><div class="budget-number" style="font-size:clamp(22px,5vw,30px)">${limit?money(daily):'—'}</div><p class="muted small">${limit?'Suggested maximum per day for the rest of this month.':'Set your limit to calculate a daily guide.'}</p></div>
   <div class="card"><div class="rowmeta">Month-end estimate</div><div class="budget-number" style="font-size:clamp(22px,5vw,30px)">${money(projected)}</div><p class="muted small">${limit?(projected>limit?'At the current pace, you may exceed your limit.':'Based on your average daily spending so far.'):'Based on current month spending so far.'}</p></div>
 </div>
 <div class="card"><div class="sectionhead"><h2>Budget settings</h2></div>
   <form id="budgetTabForm" onsubmit="saveTotalBudget(event)">
     <div class="field"><label for="budgetTabLimit">Total monthly limit (${currency()})</label><input id="budgetTabLimit" name="limit" type="number" min="0.01" step="0.01" inputmode="decimal" value="${limit||''}" placeholder="e.g. 2000" required></div>
     <button class="btn green full" type="submit">Save monthly limit</button>
   </form>
   <p class="muted small" style="margin:10px 0 0">This is one overall limit for the active profile. Qatar (QAR) and India (INR) limits are kept separate.</p>
 </div>
 <div class="card"><div class="sectionhead"><h2>Recent expenses</h2><button class="btn light smallbtn" type="button" onclick="setPage('transactions')">View all</button></div>
   ${recent.length?recent.map(txRow).join(''):empty('↗','No expenses recorded this month yet.')}
 </div>`;
}
function more(){return `${pageHead('More','Tools for your finances')}<div class="grid2"><button class="tile" onclick="setPage('credit')"><div class="ico">↔</div><strong>Credit & Debt</strong><span>Money lent, borrowed and repaid</span></button><button class="tile" onclick="setPage('reports')"><div class="ico">▥</div><strong>Monthly reports</strong><span>Charts and spending trends</span></button><button class="tile" onclick="setPage('accounts')"><div class="ico">▣</div><strong>Accounts & wallets</strong><span>Balances and transfers</span></button><button class="tile" onclick="setPage('recurring')"><div class="ico">⟳</div><strong>Recurring</strong><span>Regular income and expenses</span></button><button class="tile" onclick="setPage('data')"><div class="ico">⇅</div><strong>Import / Export</strong><span>CSV files and backup</span></button><button class="tile" onclick="setPage('settings')"><div class="ico">⚙</div><strong>Settings</strong><span>Country and app preferences</span></button></div><div class="card" style="margin-top:12px"><div class="row"><div class="grow"><div class="rowtitle">Active profile</div><div class="rowmeta">${active()==='qatar'?'Qatar · QAR':'India · INR'}</div></div><button class="btn light smallbtn" onclick="setPage('settings')">Switch country</button></div></div>`}
function accounts(){return `${pageHead('Accounts & wallets','Balances stay within this country')}<div class="card"><form onsubmit="saveAccount(event)"><div class="field"><label>Account name</label><input name="name" required placeholder="e.g. Savings account"></div><div class="formgrid"><div class="field"><label>Type</label><select name="type"><option value="bank">Bank</option><option value="cash">Cash wallet</option><option value="card">Card</option><option value="other">Other</option></select></div><div class="field"><label>Opening balance (${currency()})</label><input name="opening" type="number" step=".01" value="0" required></div></div><button class="btn green full">＋ Add account</button></form></div>${db().accounts.map(a=>`<div class="card"><div class="row"><div class="bubble">${a.type==='cash'?'◉':'▣'}</div><div class="grow"><div class="rowtitle">${esc(a.name)}</div><div class="rowmeta">${esc(a.type)} · Opening ${money(a.opening)}</div></div><div class="rowamount">${money(accountBalance(a.id))}</div></div>${a.id!=='cash'&&a.id!=='bank'?`<button class="btn danger smallbtn" style="margin-top:10px" onclick="deleteAccount('${a.id}')">Delete account</button>`:''}</div>`).join('')}<button class="btn full" onclick="setPage('add');showTransfer()">⇄ Transfer between accounts</button>`}
function credit(){const rows=db().credits.filter(c=>c.kind===creditTab);return `${pageHead('Credit & Debt','Track money lent and borrowed')}<div class="grid2"><div class="card"><div class="small muted">People owe you</div><div style="font-size:19px;font-weight:800;margin-top:8px">${money(sum(db().credits.filter(c=>c.kind==='given'),c=>Number(c.remaining)||0))}</div></div><div class="card"><div class="small muted">You owe others</div><div style="font-size:19px;font-weight:800;margin-top:8px">${money(sum(db().credits.filter(c=>c.kind==='taken'),c=>Number(c.remaining)||0))}</div></div></div><div class="tabs"><button class="${creditTab==='given'?'active':''}" onclick="creditTab='given';render()">Credit Given</button><button class="${creditTab==='taken'?'active':''}" onclick="creditTab='taken';render()">Credit Taken</button></div><div class="card"><form onsubmit="saveCredit(event)"><input type="hidden" name="kind" value="${creditTab}"><div class="field"><label>Person / lender</label><input name="person" required placeholder="Name"></div><div class="field"><label>Amount (${currency()})</label><input name="amount" type="number" min=".01" step=".01" required placeholder="0.00"></div><div class="formgrid"><div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Due date</label><input name="dueDate" type="date"></div></div><div class="field"><label>Note</label><input name="note" placeholder="Optional details"></div><button class="btn green full">＋ Add ${creditTab==='given'?'credit given':'credit taken'}</button></form></div>${rows.length?rows.map(c=>`<div class="card"><div class="row"><div class="bubble">${c.kind==='given'?'↗':'↙'}</div><div class="grow"><div class="rowtitle">${esc(c.person)}</div><div class="rowmeta">${c.kind==='given'?'Lent':'Borrowed'} ${money(c.amount)} · Due ${esc(c.dueDate||'not set')}</div></div><span class="pill ${c.remaining>0&&c.dueDate&&c.dueDate<today()?'red':c.remaining<=0?'':'orange'}">${c.remaining<=0?'Settled':c.dueDate&&c.dueDate<today()?'Overdue':'Open'}</span></div><div class="divider"></div><div class="row"><div class="grow"><div class="small muted">Outstanding</div><strong>${money(c.remaining)}</strong></div>${c.remaining>0?`<button class="btn green smallbtn" onclick="repay('${c.id}')">Record repayment</button>`:''}</div><div class="rowmeta" style="margin-top:8px">Repaid ${money((Number(c.amount)||0)-(Number(c.remaining)||0))} · ${esc(c.note||'No note')}</div><button class="btn light smallbtn" style="margin-top:10px" onclick="creditHistory('${c.id}')">Payment history</button> <button class="btn danger smallbtn" onclick="deleteCredit('${c.id}')">Delete</button></div>`).join(''):`<div class="card">${empty('↔',`No ${creditTab==='given'?'credit given':'credit taken'} records yet.`)}</div>`}`}
function reports(){const months=[];const now=new Date();for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({key:d.toISOString().slice(0,7),label:d.toLocaleDateString(undefined,{month:'short'})})}const vals=months.map(m=>({ ...m, income:sum(db().transactions.filter(t=>t.date?.slice(0,7)===m.key&&t.type==='income'),txAmount),expense:sum(db().transactions.filter(t=>t.date?.slice(0,7)===m.key&&t.type==='expense'),txAmount)}));const max=Math.max(1,...vals.flatMap(v=>[v.income,v.expense]));const cats={};monthTx().filter(t=>t.type==='expense').forEach(t=>cats[t.category||'Other']=(cats[t.category||'Other']||0)+txAmount(t));const sorted=Object.entries(cats).sort((a,b)=>b[1]-a[1]);return `${pageHead('Monthly reports','Six-month overview')}<div class="card"><div class="sectionhead"><h2>Income vs expenses</h2></div><div class="chartbar">${vals.map(v=>`<div class="barcol" title="${v.label}: income ${money(v.income)}, expenses ${money(v.expense)}"><div style="display:flex;align-items:end;gap:3px;height:100%;width:100%;justify-content:center"><div class="bar" style="height:${v.income/max*85}%;background:#9fcf68"></div><div class="bar" style="height:${v.expense/max*85}%;background:#e8a092"></div></div><div class="barlabel">${v.label}</div></div>`).join('')}</div><div class="legend"><span><i class="dot" style="background:#9fcf68"></i>Income</span><span><i class="dot" style="background:#e8a092"></i>Expenses</span></div></div><div class="card"><div class="sectionhead"><h2>This month by category</h2></div>${sorted.length?sorted.map(([c,n])=>`<div style="margin:14px 0"><div class="row"><span>${esc(c)}</span><strong class="right">${money(n)}</strong></div><div class="progress"><div style="width:${n/Math.max(1,...sorted.map(x=>x[1]))*100}%"></div></div></div>`).join(''):`<div class="empty">No expenses recorded this month.</div>`}</div><div class="card"><div class="row"><div class="grow">Net this month</div><strong class="${totals().income>=totals().expense?'amountin':'amountout'}">${money(totals().income-totals().expense)}</strong></div></div>`}
function recurring(){return `${pageHead('Recurring','Create templates for regular entries')}<div class="card"><form onsubmit="saveRecurring(event)"><div class="field"><label>Description</label><input name="title" required placeholder="e.g. Monthly salary"></div><div class="formgrid"><div class="field"><label>Type</label><select name="type"><option value="expense">Expense</option><option value="income">Income</option></select></div><div class="field"><label>Frequency</label><select name="frequency"><option value="monthly">Monthly</option><option value="weekly">Weekly</option><option value="yearly">Yearly</option></select></div></div><div class="formgrid"><div class="field"><label>Amount (${currency()})</label><input name="amount" type="number" min=".01" step=".01" required></div><div class="field"><label>Category</label><input name="category" placeholder="Rent, Salary…"></div></div><button class="btn green full">＋ Save recurring template</button></form></div>${db().recurring.length?db().recurring.map(r=>`<div class="card"><div class="row"><div class="grow"><div class="rowtitle">${esc(r.title)}</div><div class="rowmeta">${esc(r.frequency)} · ${esc(r.category||r.type)}</div></div><strong>${money(r.amount)}</strong></div><div class="actions" style="margin-top:10px"><button class="btn green smallbtn" onclick="postRecurring('${r.id}')">Add transaction now</button><button class="btn danger smallbtn" onclick="deleteRecurring('${r.id}')">Remove</button></div></div>`).join(''):`<div class="card">${empty('⟳','No recurring templates yet.')}</div>`}<div class="notice">Templates do not automatically post transactions in the background. Use “Add transaction now” when the payment occurs to avoid duplicate entries.</div>`}
function dataPage(){return `${pageHead('Import & export','Keep a portable copy of your data')}<div class="card"><h3 style="margin:0 0 7px">Export transactions</h3><p class="muted small">Download this profile’s transactions as a CSV file.</p><button class="btn green full" onclick="exportCSV()">Export transactions CSV</button><button class="btn light full" style="margin-top:8px" onclick="exportBackup()">Export full backup (JSON)</button></div><div class="card"><h3 style="margin:0 0 7px">Import transactions</h3><p class="muted small">CSV columns: date, type, amount, category, title, account, note. Imports go only into the active profile.</p><button class="btn full" onclick="$('csvFile').click()">Choose CSV file</button><div id="importMsg" class="small muted" style="margin-top:10px"></div></div><div class="card"><h3 style="margin:0 0 7px">Restore backup</h3><p class="muted small">Restore a Pennywise JSON backup. This replaces local app data, so export a backup first.</p><input type="file" id="backupFile" accept=".json,application/json" class="inlineinput"><button class="btn danger full" style="margin-top:10px" onclick="restoreBackup()">Restore JSON backup</button></div><div class="notice">Local-first privacy: data stays in this browser on this device. Export backups regularly. Clearing browser data may permanently erase records.</div>`}
function settings(){return `${pageHead('Settings','App preferences')}<div class="card"><h3 style="margin:0 0 10px">Last-opened country</h3><p class="muted small">The app opens the profile you last used.</p><div class="field"><label>Switch profile</label><select onchange="switchProfile(this.value)"><option value="qatar" ${active()==='qatar'?'selected':''}>🇶🇦 Qatar · QAR</option><option value="india" ${active()==='india'?'selected':''}>🇮🇳 India · INR</option></select></div></div><div class="card"><h3 style="margin:0 0 8px">Data management</h3><p class="muted small">Export a full backup before changing devices or clearing website data.</p><button class="btn green full" onclick="exportBackup()">Export full backup</button></div><div class="card"><h3 style="margin:0 0 8px">About</h3><div class="row"><span class="muted">Version</span><strong class="right">0.1 · Local-first</strong></div><div class="row" style="margin-top:10px"><span class="muted">Active profile</span><strong class="right">${active()==='qatar'?'Qatar (QAR)':'India (INR)'}</strong></div></div>`}
function render(){ $('profileSelect').value=active();const t=totals();$('balance').textContent=money(totalBalance());$('incomeStat').textContent=money(t.income);$('expenseStat').textContent=money(t.expense);$('greeting').textContent=active()==='qatar'?'YOUR QATAR FINANCES':'YOUR INDIA FINANCES';$('balanceSub').textContent=`${db().accounts.length} accounts · ${currency()} only`;let content={home,transactions,add:()=>addForm('expense'),budgets,more,accounts,credit,reports,recurring,data:dataPage,settings};$('main').innerHTML=(content[page]||home)()+`<div class="footer-note">Pennywise · Your data stays in this browser</div>`;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page||(page==='add'&&b.dataset.page==='add')))}
function openAdd(type='expense'){editingTx=null;page='add';render();if(type!=='expense')$('main').innerHTML=addForm(type)+`<div class="footer-note">Pennywise · Your data stays in this browser</div>`}
function showTransfer(){openAdd('transfer')}
function saveTx(e){e.preventDefault();const f=new FormData(e.target),type=f.get('type'),amount=Number(f.get('amount')),accountId=f.get('accountId'),toAccountId=f.get('toAccountId');if(!Number.isFinite(amount)||amount<=0)return alert('Enter a valid amount.');if(type==='transfer'&&accountId===toAccountId)return alert('Choose two different accounts.');const obj={id:f.get('id')||uid(),type,amount,accountId,toAccountId:type==='transfer'?toAccountId:'',category:f.get('category')||'',title:f.get('title')||'',date:f.get('date'),note:f.get('note')||''};const list=db().transactions,idx=list.findIndex(t=>t.id===obj.id);if(idx>=0)list[idx]=obj;else list.push(obj);save();editingTx=null;page='home';render()}
function editTx(id){editingTx=db().transactions.find(t=>t.id===id);if(!editingTx)return;page='add';render();$('main').innerHTML=addForm(editingTx.type)+`<div class="footer-note">Pennywise</div>`}
function deleteTx(id){if(!confirm('Delete this transaction?'))return;db().transactions=db().transactions.filter(t=>t.id!==id);save();page='transactions';render()}
function editBudgetFromTab(){page='home';budgetEditing=true;render();const input=document.getElementById('homeBudgetInput');if(input){input.focus();input.select();}}
function cancelBudgetEdit(){budgetEditing=false;render();}
function saveHomeBudget(e){if(e)e.preventDefault();const form=document.getElementById('homeBudgetForm');const input=form?.elements?.namedItem('limit');if(!input){alert('Budget form could not be found. Please reopen the budget editor.');return;}const value=Number(input.value);if(!input.value.trim()||!Number.isFinite(value)||value<=0){input.focus();alert('Enter a monthly budget greater than zero.');return;}db().totalBudget=value;save();budgetEditing=false;page='home';render();}
function saveTotalBudget(e){if(e)e.preventDefault();const form=e?.currentTarget||document.getElementById('budgetTabForm');const input=form?.elements?.namedItem('limit');const value=Number(input?.value);if(!input||!input.value.trim()||!Number.isFinite(value)||value<=0){if(input)input.focus();alert('Enter a monthly budget greater than zero.');return;}db().totalBudget=value;save();budgetEditing=false;page='budgets';render();}
function saveBudget(e){e.preventDefault();const f=new FormData(e.target),category=f.get('category'),limit=Number(f.get('limit'));if(limit<=0)return;const existing=db().budgets.find(b=>b.category===category);if(existing)existing.limit=limit;else db().budgets.push({id:uid(),category,limit});save();render()}
function deleteBudget(id){if(confirm('Remove this budget?')){db().budgets=db().budgets.filter(b=>b.id!==id);save();render()}}
function saveAccount(e){e.preventDefault();const f=new FormData(e.target);db().accounts.push({id:uid(),name:f.get('name'),type:f.get('type'),opening:Number(f.get('opening'))||0});save();render()}
function deleteAccount(id){if(!confirm('Delete this account? Only accounts without transactions can be safely removed.'))return;if(db().transactions.some(t=>t.accountId===id||t.toAccountId===id))return alert('This account has transactions. Keep it to preserve your history.');db().accounts=db().accounts.filter(a=>a.id!==id);save();render()}
function saveCredit(e){e.preventDefault();const f=new FormData(e.target),amount=Number(f.get('amount'));if(amount<=0)return;db().credits.push({id:uid(),kind:f.get('kind'),person:f.get('person'),amount,remaining:amount,date:f.get('date'),dueDate:f.get('dueDate'),note:f.get('note')});save();render()}
function repay(id){const c=db().credits.find(x=>x.id===id);if(!c||c.remaining<=0)return;const raw=prompt(`Outstanding ${money(c.remaining)}. Enter repayment amount:`);if(raw===null)return;const amt=Number(raw);if(!Number.isFinite(amt)||amt<=0||amt>c.remaining)return alert('Enter a positive amount no greater than the outstanding balance.');c.remaining=Math.round((c.remaining-amt)*100)/100;db().payments.push({id:uid(),creditId:id,amount:amt,date:today()});save();render()}
function creditHistory(id){const c=db().credits.find(x=>x.id===id);const ps=db().payments.filter(p=>p.creditId===id);alert(`${c.person}\nOriginal: ${money(c.amount)}\nOutstanding: ${money(c.remaining)}\n\nPayments:\n${ps.length?ps.map(p=>`${p.date}: ${money(p.amount)}`).join('\n'):'No repayments recorded.'}`)}
function deleteCredit(id){if(!confirm('Delete this credit/debt record and its payment history?'))return;db().credits=db().credits.filter(c=>c.id!==id);db().payments=db().payments.filter(p=>p.creditId!==id);save();render()}
function saveRecurring(e){e.preventDefault();const f=new FormData(e.target);db().recurring.push({id:uid(),title:f.get('title'),type:f.get('type'),frequency:f.get('frequency'),amount:Number(f.get('amount')),category:f.get('category')});save();render()}
function postRecurring(id){const r=db().recurring.find(x=>x.id===id);if(!r)return;db().transactions.push({id:uid(),type:r.type,amount:r.amount,accountId:db().accounts[0].id,category:r.category||r.type,title:r.title,date:today(),note:'Created from recurring template'});save();alert('Transaction added to the active profile.');render()}
function deleteRecurring(id){db().recurring=db().recurring.filter(r=>r.id!==id);save();render()}
function switchProfile(p){if(!['qatar','india'].includes(p))return;currentProfile=p;save();page='home';render()}
function setTransactionFilter(value){if(!['all','income','expense','transfer'].includes(value))return;transactionFilter=value;render();}
function filterTxSearch(q){const list=db().transactions.filter(t=>[t.title,t.category,t.note,t.date,t.type].some(v=>String(v||'').toLowerCase().includes(q.toLowerCase()))).sort((a,b)=>(b.date||'').localeCompare(a.date||''));$('txList').innerHTML=list.length?list.map(txRow).join(''):empty('⌕','No matching transactions.')}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function exportCSV(){const cols=['date','type','amount','category','title','account','toAccount','note'];const lines=[cols.join(','),...db().transactions.map(t=>[t.date,t.type,t.amount,t.category,t.title,accountName(t.accountId),accountName(t.toAccountId),t.note].map(csvCell).join(','))];download(`pennywise-${active()}-transactions.csv`,'\ufeff'+lines.join('\r\n'),'text/csv;charset=utf-8')}
function exportBackup(){download(`pennywise-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({version:1,exportedAt:new Date().toISOString(),data,lastProfile:currentProfile},null,2),'application/json')}
function restoreBackup(){const file=$('backupFile')?.files?.[0];if(!file)return alert('Choose a backup JSON file first.');if(!confirm('This will replace the current local data for both profiles. Continue?'))return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);const incoming=parsed.data;if(!incoming?.qatar||!incoming?.india)throw new Error('Invalid backup');data=incoming;currentProfile=parsed.lastProfile==='india'?'india':'qatar';save();page='home';render();alert('Backup restored.')}catch(e){alert('Could not restore this backup file.')}};reader.readAsText(file)}
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&quoted&&n==='"'){cell+='"';i++}else if(c==='"'){quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
$('csvFile').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const rows=parseCSV(reader.result);if(rows.length<2)throw new Error('empty');const headers=rows.shift().map(h=>h.trim().toLowerCase());let added=0,skipped=0;for(const row of rows){const o={};headers.forEach((h,i)=>o[h]=(row[i]||'').trim());const type=(o.type||'expense').toLowerCase();const amount=Number(o.amount);if(!o.date||!Number.isFinite(amount)||amount<=0||!['income','expense','transfer'].includes(type)){skipped++;continue}let account=db().accounts.find(a=>a.name.toLowerCase()===(o.account||'').toLowerCase());if(!account)account=db().accounts[0];let to=db().accounts.find(a=>a.name.toLowerCase()===(o.toaccount||'').toLowerCase());db().transactions.push({id:uid(),date:o.date.slice(0,10),type,amount,category:o.category||'',title:o.title||'',accountId:account.id,toAccountId:type==='transfer'?(to||db().accounts[1]||account).id:'',note:o.note||''});added++}save();$('importMsg').textContent=`Imported ${added} transactions; skipped ${skipped} invalid rows. Active profile: ${active()}.`;render()}catch(err){$('importMsg').textContent='Could not read this CSV. Check the required columns and try again.'}};reader.readAsText(file);e.target.value=''});
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{editingTx=null;setPage(b.dataset.page)}));
$('profileSelect').addEventListener('change',e=>switchProfile(e.target.value));
window.setTransactionFilter=setTransactionFilter;window.filterTxSearch=filterTxSearch;window.setPage=setPage;window.openAdd=openAdd;window.showTransfer=showTransfer;window.saveTx=saveTx;window.editTx=editTx;window.deleteTx=deleteTx;window.editTotalBudget=editTotalBudget;window.saveHomeBudget=saveHomeBudget;window.saveTotalBudget=saveTotalBudget;window.editBudgetFromTab=editBudgetFromTab;window.cancelBudgetEdit=cancelBudgetEdit;window.saveBudget=saveBudget;window.deleteBudget=deleteBudget;window.saveAccount=saveAccount;window.deleteAccount=deleteAccount;window.saveCredit=saveCredit;window.repay=repay;window.creditHistory=creditHistory;window.deleteCredit=deleteCredit;window.saveRecurring=saveRecurring;window.postRecurring=postRecurring;window.deleteRecurring=deleteRecurring;window.switchProfile=switchProfile;window.filterTxSearch=filterTxSearch;window.exportCSV=exportCSV;window.exportBackup=exportBackup;window.restoreBackup=restoreBackup;window.transactionFilter=transactionFilter;window.creditTab=creditTab;window.render=render;
save();render();
})();
</script>
</body></html>
